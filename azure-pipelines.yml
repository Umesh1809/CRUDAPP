trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Service connections (Ensure these match your Azure DevOps dashboard names exactly)
  dockerRegistryServiceConnection: 'k8spraticeacr' 
  azureServiceConnection: 'aks-devops-connection'
  
  # Application infrastructure configuration variables
  imageRepository: 'umeshcrudapp'
  containerRegistry: 'k8spraticeacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  resourceGroup: 'k8spratice'
  clusterName: 'k8s-pratice'
  
  # 🔐 SECURITY TOKENS: Paste your SonarCloud token value here
  sonarToken: 'your-sonarcloud-token-value-here'

stages:
# =========================================================
# STAGE 1: CONTINUOUS INTEGRATION (BUILD, TEST, SCANS)
# =========================================================
- stage: Build
  displayName: "CI: Build, Test, and Scan"
  jobs:
  - job: Build
    steps:
    # 1. Dynamically provision Node and npm in the cloud pipeline environment
    - task: NodeTool@0
      displayName: 'Install Node.js Environment'
      inputs:
        versionSpec: '22.x'

    # 2. Install application dependencies and run unit tests
    - script: |
        npm install
        npm test
      displayName: 'Run Application Unit Tests'
      continueOnError: false

    # 3. Native SonarQube static code scan (No organization plugin needed)
    # 🟢 Updated Scan task passing precise organizational qualifiers
    - script: |
        npx sonarqube-scanner \
          -Dsonar.host.url="https://sonarcloud.io" \
          -Dsonar.token="$(sonarToken)" \
          -Dsonar.organization="your-actual-sonarcloud-organization-name" \ # 🟢 ADD THIS LINE
          -Dsonar.projectKey="your-exact-project-key-from-sonarcloud" \       # 🟢 UPDATE THIS LINE
          -Dsonar.projectName="CRUDAPP" \
          -Dsonar.sources="."
      displayName: 'SonarQube: Scan Code Architecture Security'
      continueOnError: true

    # 4. Compile the local container container target layers
    - task: Docker@2
      displayName: 'Build Docker Image for Evaluation'
      inputs:
        command: 'build'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        tags: '$(tag)'

    # 5. Native Trivy runtime binary download and registry scan execution
    - script: |
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y
        wget -qO - https://github.io | gpg --dearmor | sudo tee /etc/apt/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/etc/apt/keyrings/trivy.gpg] https://github.io $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update && sudo apt-get install trivy -y
        
        # Scan your image container target for major structural flaws
        trivy image --severity HIGH,CRITICAL --exit-code 1 $(imageRepository):$(tag)
      displayName: 'Trivy: Scan Image for High/Critical Risks'
      continueOnError: false # Breaks the build if your container contains dangerous vulnerabilities

    # 6. Push the verified image out to your Azure Container Registry
    - task: Docker@2
      displayName: 'Push Secure Image to ACR'
      inputs:
        command: 'push'
        repository: '$(imageRepository)'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)
          latest

    # 7. Package and publish your Kubernetes subfolder configuration files
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Kubernetes Manifest Folder'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/Kubernetes'
        artifact: 'manifests'
        publishLocation: 'pipeline'

# =========================================================
# STAGE 2: CONTINUOUS DEPLOYMENT (AUTOMATED DELIVERY)
# =========================================================
- stage: Deploy
  displayName: "CD: Rolling Update to AKS"
  dependsOn: Build
  condition: succeeded() # ⚡ Only triggers if the Build, Test, and Trivy steps pass cleanly
  jobs:
  - job: Deploy
    steps:
    # 1. Download your workspace manifest drop target folder
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Published Manifests'
      inputs:
        buildType: 'current'
        artifactName: 'manifests'
        targetPath: '$(Pipeline.Workspace)/manifests'

    # 2. Login to your South Central US AKS Cluster nodes
    - task: AzureCLI@2
      displayName: 'Fetch AKS Cluster Credentials'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(clusterName) --overwrite-existing

    # 3. Map your application manifests onto your cluster endpoints
    - task: KubernetesManifest@1
      displayName: 'Execute Zero-Downtime Rollout'
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureServiceConnection)'
        azureResourceGroup: '$(resourceGroup)'
        kubernetesCluster: '$(clusterName)'
        namespace: 'default'
        manifests: |
          $(Pipeline.Workspace)/manifests/deployment.yaml
          $(Pipeline.Workspace)/manifests/service.yaml
        containers: |
          $(containerRegistry)/$(imageRepository):$(tag)
