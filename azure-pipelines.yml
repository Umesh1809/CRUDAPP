trigger:
- main  # ⚡ AUTOMATION TRIGGER: Runs the entire pipeline automatically on every Git push

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Connections (Ensure these match your Azure DevOps Service Connection names exactly)
  dockerRegistryServiceConnection: 'k8spraticeacr-service-connection' 
  azureServiceConnection: 'aks-devops-connection'
  
  # Infrastructure configuration
  imageRepository: 'umeshcrudapp'
  containerRegistry: 'k8spraticeacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)' # Automatically assigns a unique number to every build iteration
  resourceGroup: 'k8spratice'
  clusterName: 'k8s-pratice'

stages:
# ---------------------------------------------------------
# STAGE 1: AUTOMATIC BUILD (CI)
# ---------------------------------------------------------
- stage: Build
  displayName: "Automated Build and Push"
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: 'Build & Push Docker Image to ACR'
      inputs:
        command: 'buildAndPush'
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

# ---------------------------------------------------------
# STAGE 2: AUTOMATIC DEPLOYMENT (CD)
# ---------------------------------------------------------
- stage: Deploy
  displayName: "Automated Rolling Update to AKS"
  dependsOn: Build
  condition: succeeded() # ⚡ Only triggers if the Build stage completes cleanly
  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      displayName: 'Fetch AKS Cluster Credentials'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(clusterName) --overwrite-existing

    - task: KubernetesManifest@1
      displayName: 'Execute Zero-Downtime Rollout'
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureServiceConnection)'
        azureResourceGroup: '$(resourceGroup)'
        kubernetesCluster: '$(clusterName)'
        namespace: 'default'
        manifests: |
          $(System.DefaultWorkingDirectory)/deployment.yaml
        containers: |
          $(containerRegistry)/$(imageRepository):$(tag)
