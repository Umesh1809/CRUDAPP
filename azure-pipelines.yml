trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'k8spraticeacr' # Matched to your dashboard screenshot
  azureServiceConnection: 'aks-devops-connection'
  imageRepository: 'umeshcrudapp'
  containerRegistry: 'k8spraticeacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  resourceGroup: 'k8spratice'
  clusterName: 'k8s-pratice'

stages:
# ---------------------------------------------------------
# STAGE 1: AUTOMATIC BUILD (CI)
# ---------------------------------------------------------
- stage: Build
  displayName: "Automated Build and Push"
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: 'Build & Push Docker Image to ACR'
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)
          latest

    # 🟢 NEW STEP: Save your local deployment.yaml file into pipeline storage
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Kubernetes Manifest File'
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/deployment.yaml'
        artifact: 'manifests'
        publishLocation: 'pipeline'

# ---------------------------------------------------------
# STAGE 2: AUTOMATIC DEPLOYMENT (CD)
# ---------------------------------------------------------
- stage: Deploy
  displayName: "Automated Rolling Update to AKS"
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    # 🟢 NEW STEP: Pull the manifest file down into the deployment agent container
    - task: DownloadPipelineArtifact@2
      displayName: 'Download Published Manifest File'
      inputs:
        buildType: 'current'
        artifactName: 'manifests'
        targetPath: '$(Pipeline.Workspace)/manifests'

    - task: AzureCLI@2
      displayName: 'Fetch AKS Cluster Credentials'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials --resource-group $(resourceGroup) --name $(clusterName) --overwrite-existing

    - task: KubernetesManifest@1
      displayName: 'Execute Zero-Downtime Rollout'
      inputs:
        action: 'deploy'
        connectionType: 'azureResourceManager'
        azureSubscriptionConnection: '$(azureServiceConnection)'
        azureResourceGroup: '$(resourceGroup)'
        kubernetesCluster: '$(clusterName)'
        namespace: 'default'
        # 🟢 UPDATED: Reads the file straight out of the download target workspace path
        manifests: |
          $(Pipeline.Workspace)/manifests/deployment.yaml
        containers: |
          $(containerRegistry)/$(imageRepository):$(tag)
