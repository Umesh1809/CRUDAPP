trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  # 1. Replace with your exact Service Connection Name from Step 1
  azureServiceConnection: 'aks-devops-connection'
  # 2. Replace with your exact Resource Group Name
  resourceGroup: 'k8spratice'
  # 3. Replace with your exact AKS Cluster Name
  clusterName: 'k8s-pratice'

steps:
# Step A: Login to your Azure Account and fetch the AKS Credentials
- task: AzureCLI@2
  displayName: 'Connect to AKS Cluster'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az aks get-credentials --resource-group $(resourceGroup) --name $(clusterName) --overwrite-existing

# Step B: Apply your deployment and service configurations directly to AKS
- task: Kubernetes@1
  displayName: 'Deploy Manifests to AKS'
  inputs:
    connectionType: 'Azure Resource Manager'
    azureSubscriptionEndpoint: '$(azureServiceConnection)'
    azureResourceGroup: '$(resourceGroup)'
    kubernetesCluster: '$(clusterName)'
    useClusterAdmin: true
    command: 'apply'
    useConfigurationFile: true
    configuration: 'deployment.yaml' # Change path if it is inside a subfolder (e.g., kubernetes/deployment.yaml)
