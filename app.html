<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Spirograph Heart</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0914;
        font-family: "Courier New", Courier, monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #text-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #ffffff;
        font-size: clamp(1.8rem, 6vw, 4rem);
        font-weight: 300;
        letter-spacing: 6px;
        line-height: 1.4;
        pointer-events: none;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.7),
          0 0 20px rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="text-container">
      I LOVE<br />YOU<br /><span style="font-size: 0.6em; letter-spacing: 3px"
        >MOM & DAD</span
      >
    </div>
    <canvas id="spiroCanvas"></canvas>

    <script>
      const canvas = document.getElementById("spiroCanvas");
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      let time = 0;
      const totalLoops = 75; // Number of interlocking ring wireframes
      const pointsPerLoop = 120; // Structural details of individual loops

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // 3D projection helper function (converts X, Y, Z space to flat screen screen pixels)
      function project3D(x, y, z) {
        const fov = 400; // Camera perspective field of view
        const distance = 15; // Camera distance
        const scale = fov / (z + distance);
        return {
          x: width / 2 + x * scale,
          y: height / 2 - y * scale,
        };
      }

      function animate() {
        // Clears screen with a semi-transparent layer to create smooth glow motion trails
        ctx.fillStyle = "rgba(11, 9, 20, 0.15)";
        ctx.fillRect(0, 0, width, height);

        time += 0.015; // Controls overall movement speed

        // Slow global rotation angles across axes
        const rotY = Math.sin(time * 0.3) * 0.4;
        const rotX = Math.cos(time * 0.2) * 0.2;
        const rotZ = time * 0.1;

        // Generate and render the spirograph curves
        for (let i = 0; i < totalLoops; i++) {
          // Space loops evenly around the parametric heart profile
          const baseAngle = (i / totalLoops) * Math.PI * 2;

          // Color spectrum math to mimic the rainbow sequence in the photo
          const hue = (i / totalLoops) * 360;
          ctx.strokeStyle = `hsla(${hue}, 95%, 60%, 0.45)`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();

          for (let j = 0; j <= pointsPerLoop; j++) {
            const subAngle = (j / pointsPerLoop) * Math.PI * 2;

            // Creates the overlapping ring wave pattern inside each segment
            const waveOffset =
              Math.sin(subAngle * 3 + time * 2 + i * 0.1) * 0.4;
            const t = baseAngle + waveOffset;

            // Perfect parametric Heart shape calculus blueprint
            let x3d = 16 * Math.pow(Math.sin(t), 3) * 0.22;
            let y3d =
              (13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t)) *
              0.22;

            // Generate 3D depth wave ripples along the structural loops
            let z3d =
              Math.cos(subAngle * 2 + time) * 0.8 +
              Math.sin(baseAngle * 2) * 0.4;

            // 1. Apply Y-Axis Rotation Math
            let cosY = Math.cos(rotY),
              sinY = Math.sin(rotY);
            let xRot1 = x3d * cosY - z3d * sinY;
            let zRot1 = x3d * sinY + z3d * cosY;

            // 2. Apply X-Axis Rotation Math
            let cosX = Math.cos(rotX),
              sinX = Math.sin(rotX);
            let yRot2 = y3d * cosX - zRot1 * sinX;
            let zRot2 = y3d * sinX + zRot1 * cosX;

            // 3. Apply Z-Axis Rotation Math
            let cosZ = Math.cos(rotZ),
              sinZ = Math.sin(rotZ);
            let finalX = xRot1 * cosZ - yRot2 * sinZ;
            let finalY = xRot1 * sinZ + yRot2 * cosZ;

            // Project the final positions onto your screen coordinates
            const screenPos = project3D(finalX, finalY + 0.3, zRot2);

            if (j === 0) {
              ctx.moveTo(screenPos.x, screenPos.y);
            } else {
              ctx.lineTo(screenPos.x, screenPos.y);
            }
          }
          ctx.stroke();
        }

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
