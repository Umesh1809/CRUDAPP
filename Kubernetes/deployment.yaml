apiVersion: apps/v1
kind: Deployment
metadata:
  name: umeshcrudapp-deployment
  labels:
    app: umeshcrudapp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: umeshcrudapp
  template:
    metadata:
      labels:
        app: umeshcrudapp
    spec:
      containers:
      - name: umeshcrudapp-container
        # 🟢 Change ':latest' to the dynamic tag variable so your pipeline updates it on every push:
        image: k8spraticeacr.azurecr.io/umeshcrudapp:$(Build.BuildId) 
        ports:
        - containerPort: 32778
